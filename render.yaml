# One-click deployment on Render — the WHOLE app, not just the API.
#
# In the Render dashboard: New -> Blueprint -> point at this repository.
# Render reads this file and provisions the service. Nothing else to configure.
#
# The Dockerfile is multi-stage: Node builds the dashboard, Python serves both
# it and the API from one process. So a single service is the complete product
# on one URL — landing page, dashboard, scanner, face recognition, accounts,
# assistant and documentation.
#
# That single-origin setup is also why there is no CORS configuration and no
# cross-site cookie handling here: the browser is talking to the same host it
# loaded the page from, which is the simplest and most robust arrangement.
# (Those settings exist for the split deployment — frontend on Vercel, API
# elsewhere — and are documented in DEPLOYMENT.md.)
#
# Free plan, worth knowing before the demo:
#   * the instance sleeps after 15 minutes idle and takes ~50 s to wake, so the
#     first request after a pause is slow
#   * its disk is ephemeral, so accounts and scan history reset on restart.
#     That is why the data directory points at /tmp rather than pretending to
#     be durable. Attach a disk on a paid plan for persistence.

services:
  - type: web
    name: omniguard
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects PORT; the app reads it. HOST must be 0.0.0.0 or the
      # service is unreachable from outside the container.
      - key: OMNIGUARD_HOST
        value: 0.0.0.0

      # Writable on the free plan. Ephemeral by nature — see the note above.
      - key: OMNIGUARD_DATA_DIR
        value: /tmp/omniguard

      # The face models are committed, so there is nothing to fetch at boot.
      # Disabling the attempt keeps cold starts quick and avoids a needless
      # outbound request.
      - key: OMNIGUARD_AUTO_DOWNLOAD
        value: "0"
