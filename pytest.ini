[pytest]
testpaths = backend/tests

# Keep pytest's temporary directories on this drive.
#
# By default pytest writes tmp_path fixtures under the system TEMP, which on
# this machine is on a C: drive with no free space. Every test that uses
# tmp_path then fails with "disk I/O error" or "database or disk is full" -
# which looked like a code fault but was the disk.
#
# --basetemp wipes the directory it is given, so this points at a dedicated
# path inside the project's own scratch area rather than anything shared.
addopts = --basetemp=.tmp/pytest

filterwarnings =
    ignore::DeprecationWarning:starlette.*
